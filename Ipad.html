<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<script src="https://js.appetize.io/embed.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* FAKE FULLSCREEN FALLBACK */
.fullscreen-fake {
  position: fixed !important;
  inset: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  background: black !important;
  z-index: 99999 !important;
}

/* EMULATOR WRAPPER */
#appetizeWrapper {
  width: 100%;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* iPad LOOK */
#appetize-iframe {
  width: 100%;
  height: 100%;
  border: none;
  aspect-ratio: 4 / 3;
  max-width: 100%;
}

/* SETUP OVERLAY */
#setupOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#setupBox {
  background: rgba(30,30,30,0.95);
  padding: 20px;
  border-radius: 20px;
  width: 90%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
}

#setupBox h3 {
  color: white;
  margin-top: 10px;
}

.optionBtn {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 12px;
  border: none;
  background: #444;
  color: white;
}

.optionBtn.selected {
  background: #0a84ff;
}

/* HOME BAR */
#homeSwipeZone {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40px;
}

#homeBarVisual {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,0.2);
  opacity: 0.8;
}

/* DESKTOP BUTTON */
#homeBtn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px;
  border-radius: 999px;
  border: none;
  background: rgba(255,255,255,0.12);
  color: white;
  display: none;
  z-index: 10000;
}
</style>
</head>

<body>

<div id="setupOverlay">
  <div id="setupBox">
    <h3>Select iPad</h3>
    <div id="deviceOptions"></div>

    <h3>Select iPadOS</h3>
    <div id="osOptions"></div>
  </div>
</div>

<div id="appetizeWrapper">
  <iframe id="appetize-iframe"></iframe>

  <div id="homeSwipeZone">
    <div id="homeBarVisual"></div>
  </div>
</div>

<button id="homeBtn">Home</button>

<script>
(async () => {

const devices = [
  "ipadmini",
  "ipadair11",
  "ipadair13",
  "ipadpro11",
  "ipadpro13",
  "ipad10",
  "ipad9"
];

const osVersions = ["26.0","18.2","17.2","16.2","15.5"];

const deviceContainer = document.getElementById("deviceOptions");
const osContainer = document.getElementById("osOptions");
const overlay = document.getElementById("setupOverlay");
const iframe = document.getElementById("appetize-iframe");
const homeBtn = document.getElementById("homeBtn");

let selectedDevice = null;
let selectedOS = null;
let session = null;

/* detect desktop */
const isDesktop =
  !('ontouchstart' in window) ||
  window.matchMedia("(pointer:fine)").matches;

if (isDesktop) homeBtn.style.display = "block";

/* buttons */
devices.forEach(d => {
  const b = document.createElement("button");
  b.className = "optionBtn";
  b.textContent = d;

  b.onclick = () => {
    selectedDevice = d;
    document.querySelectorAll("#deviceOptions .optionBtn")
      .forEach(x => x.classList.remove("selected"));
    b.classList.add("selected");
  };

  deviceContainer.appendChild(b);
});

osVersions.forEach(o => {
  const b = document.createElement("button");
  b.className = "optionBtn";
  b.textContent = o;

  b.onclick = () => {
    selectedOS = o;
    document.querySelectorAll("#osOptions .optionBtn")
      .forEach(x => x.classList.remove("selected"));
    b.classList.add("selected");
  };

  osContainer.appendChild(b);
});

/* KEEP YOUR URL FORMAT EXACT */
function getURL(device, os) {
  return `https://appetize.io/embed/vhqck47rafavf76mxopgws2jie?device=${device}&osVersion=${os}&appearance=dark&audio=true&autoplay=true&scale=auto&centered=true&xdocMsg=true&launchApp=false&screenOnly=true&orientation=landscape`;
}

/* SDK */
function waitSDK() {
  return new Promise(res => {
    if (window.appetize) return res();
    const i = setInterval(() => {
      if (window.appetize) {
        clearInterval(i);
        res();
      }
    }, 100);
  });
}

/* FULLSCREEN (REAL + FALLBACK) */
async function enterFullscreen() {
  const el = document.documentElement;

  try {
    if (el.requestFullscreen) {
      await el.requestFullscreen();
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else {
      document.body.classList.add("fullscreen-fake");
    }
  } catch (e) {
    console.log("Fullscreen blocked");
    document.body.classList.add("fullscreen-fake");
  }
}

/* LOAD */
async function load(device, os) {
  iframe.src = getURL(device, os);

  await waitSDK();

  const client = await window.appetize.getClient("#appetize-iframe");
  client.on("session", s => session = s);
}

/* MUST BE USER GESTURE */
overlay.addEventListener("click", async () => {
  if (!selectedDevice || !selectedOS) return;

  overlay.remove();
  load(selectedDevice, selectedOS);

  await enterFullscreen();
});

/* HOME BUTTON */
homeBtn.onclick = () => {
  session?.keypress("HOME");
};

/* SWIPE HOME */
let startY = 0;
let deltaY = 0;

document.addEventListener("touchstart", e => {
  startY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", () => {
  if (deltaY > 40) session?.keypress("HOME");
});

document.addEventListener("touchmove", e => {
  deltaY = startY - e.touches[0].clientY;
}, { passive: true });

})();
</script>

</body>
</html>
