<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>

<title>iPad Emulator</title>

<script src="https://js.appetize.io/embed.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* BASE */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    touch-action: manipulation;
}

/* EMULATOR */
#appetizeWrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
}

#appetize-iframe {
    width: 100vw;
    height: 100vh;
    border: none;
}

/* SETUP */
#setupOverlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(24px);
}

#setupBox {
    width: 92%;
    max-width: 520px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 24px;
    border-radius: 28px;
    background: rgba(28,28,28,0.97);
}

#setupBox h2 {
    color: white;
    font-size: 26px;
}

/* BUTTONS */
.optionGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
}

.optionBtn {
    border: none;
    border-radius: 18px;
    padding: 14px 10px;
    background: rgba(255,255,255,0.08);
    color: white;
    cursor: pointer;
}

.optionBtn.selected {
    background: #0a84ff;
}

#launchBtn {
    width: 100%;
    margin-top: 22px;
    border: none;
    border-radius: 18px;
    padding: 16px;
    background: #0a84ff;
    color: white;
    font-size: 17px;
    opacity: 0.45;
    pointer-events: none;
}

#launchBtn.active {
    opacity: 1;
    pointer-events: auto;
}

/* HOME SWIPE */
#homeSwipeZone {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 24px;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}

#homeBarVisual {
    width: 134px;
    height: 5px;
    border-radius: 999px;
    background: white;
    opacity: 0.6;
    margin-bottom: 8px;
}

/* DESKTOP HOME BUTTON */
#homeBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    background: rgba(255,255,255,0.12);
    color: white;
    font-size: 14px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    display: none;
    z-index: 10000;
}

#homeBtn:active {
    transform: translateX(-50%) scale(0.95);
}

</style>
</head>

<body>

<!-- SETUP -->
<div id="setupOverlay">
    <div id="setupBox">
        <h2>Select iPad</h2>

        <div class="optionGrid" id="deviceOptions"></div>

        <h2>Select iPadOS</h2>

        <div class="optionGrid" id="osOptions"></div>

        <button id="launchBtn">Launch Emulator</button>
    </div>
</div>

<!-- EMULATOR -->
<div id="appetizeWrapper">
    <iframe id="appetize-iframe"></iframe>
</div>

<!-- MOBILE HOME BAR -->
<div id="homeSwipeZone">
    <div id="homeBarVisual"></div>
</div>

<!-- DESKTOP HOME BUTTON -->
<button id="homeBtn">Home</button>

<script>
(async () => {

const devices = ["ipadmini","ipadair11","ipadair13","ipadpro11","ipadpro13","ipad10","ipad9"];
const osVersions = ["26.0","18.2","17.2","16.2","15.5"];

const deviceContainer = document.getElementById("deviceOptions");
const osContainer = document.getElementById("osOptions");
const overlay = document.getElementById("setupOverlay");
const launchBtn = document.getElementById("launchBtn");
const iframe = document.getElementById("appetize-iframe");
const swipeZone = document.getElementById("homeSwipeZone");
const homeBtn = document.getElementById("homeBtn");

let selectedDevice = null;
let selectedOS = null;
let session = null;

let startY = 0;
let deltaY = 0;

/* DEVICE TYPE DETECTION */
const isDesktop =
    !('ontouchstart' in window) ||
    window.matchMedia("(pointer:fine)").matches;

/* SWITCH UI MODE */
if (isDesktop) {
    swipeZone.style.display = "none";
    homeBtn.style.display = "block";
} else {
    swipeZone.style.display = "flex";
    homeBtn.style.display = "none";
}

/* BUTTONS */
devices.forEach(d => {
    const b = document.createElement("button");
    b.className = "optionBtn";
    b.textContent = d;

    b.onclick = () => {
        selectedDevice = d;
        document.querySelectorAll("#deviceOptions .optionBtn")
            .forEach(x => x.classList.remove("selected"));
        b.classList.add("selected");
        if (selectedDevice && selectedOS) launchBtn.classList.add("active");
    };

    deviceContainer.appendChild(b);
});

osVersions.forEach(o => {
    const b = document.createElement("button");
    b.className = "optionBtn";
    b.textContent = o;

    b.onclick = () => {
        selectedOS = o;
        document.querySelectorAll("#osOptions .optionBtn")
            .forEach(x => x.classList.remove("selected"));
        b.classList.add("selected");
        if (selectedDevice && selectedOS) launchBtn.classList.add("active");
    };

    osContainer.appendChild(b);
});

/* URL */
function getURL(device, os) {
    return `https://appetize.io/embed/vhqck47rafavf76mxopgws2jie?device=${device}&osVersion=${os}&appearance=dark&audio=true&autoplay=true&scale=auto&centered=true&xdocMsg=true&launchApp=false&screenOnly=true&orientation=landscape`;
}
/* LAUNCH */
launchBtn.onclick = async () => {

    overlay.remove();

    iframe.src = getURL(selectedDevice, selectedOS);

    const wait = setInterval(() => {
        if (window.appetize) {
            clearInterval(wait);

            window.appetize.getClient("#appetize-iframe")
                .then(client => {
                    client.on("session", s => session = s);
                });
        }
    }, 100);
};

/* HOME BUTTON */
homeBtn.onclick = () => {
    session?.keypress("HOME");
};

/* SWIPE HOME */
swipeZone.addEventListener("touchstart", e => {
    startY = e.touches[0].clientY;
    deltaY = 0;
}, { passive: true });

swipeZone.addEventListener("touchmove", e => {
    deltaY = startY - e.touches[0].clientY;
}, { passive: true });

swipeZone.addEventListener("touchend", () => {
    if (deltaY > 45) {
        session?.keypress("HOME");
    }
});

/* BLOCK BOUNCE */
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

})();
</script>

</body>
</html>
