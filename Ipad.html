<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<title>iPad Emulator</title>

<script src="https://js.appetize.io/embed.js"></script>

<!-- Fullscreen support on iPad -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    touch-action: manipulation;
}

/* Wrapper */
#appetizeWrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Emulator */
#appetize-iframe {
    width: 100vw;
    height: 100vh;
    border: none;
    background: black;
}

/* Better iPad scaling */
@media (orientation: landscape) {
    #appetize-iframe {
        width: 100vw;
        height: 100vh;
    }
}

@media (orientation: portrait) {
    #appetize-iframe {
        width: 100vw;
        height: 100vh;
    }
}

/* Setup Overlay */
#setupOverlay {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(25px);
}

/* Box */
#setupBox {
    width: 92%;
    max-width: 500px;
    max-height: 82vh;

    overflow-y: auto;

    padding: 24px;
    border-radius: 26px;

    background: rgba(32,32,32,0.96);

    box-shadow:
        0 0 30px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.05);

    animation: popIn 0.28s ease;
}

#setupBox h2 {
    color: white;
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 24px;
    font-weight: 700;
}

#setupBox h3 {
    color: rgba(255,255,255,0.92);
    margin-top: 20px;
    margin-bottom: 12px;
    font-size: 16px;
    font-weight: 600;
}

/* Grid */
.optionGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
    gap: 10px;
}

/* Buttons */
.optionBtn {
    border: none;
    border-radius: 16px;

    padding: 14px 10px;

    background: rgba(255,255,255,0.08);
    color: white;

    font-size: 14px;
    font-weight: 600;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

    cursor: pointer;
}

.optionBtn:active {
    transform: scale(0.96);
}

.optionBtn.selected {
    background: #0a84ff;

    box-shadow:
        0 0 18px rgba(10,132,255,0.5);
}

/* Start button */
#launchBtn {
    width: 100%;
    margin-top: 22px;

    border: none;
    border-radius: 18px;

    padding: 16px;

    background: #0a84ff;
    color: white;

    font-size: 17px;
    font-weight: 700;

    opacity: 0.45;
    pointer-events: none;

    transition: 0.2s ease;
}

#launchBtn.active {
    opacity: 1;
    pointer-events: auto;
}

#launchBtn:active {
    transform: scale(0.98);
}

/* Fade */
.fadeOut {
    animation: fadeOut 0.3s forwards;
}

@keyframes popIn {
    from {
        opacity: 0;
        transform: scale(0.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeOut {
    to {
        opacity: 0;
        transform: scale(0.92);
    }
}

/* Safe area support */
body {
    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}
</style>
</head>

<body>

<div id="setupOverlay">
    <div id="setupBox">

        <h2>Select iPad</h2>

        <div class="optionGrid" id="deviceOptions"></div>

        <h3>Select iPadOS Version</h3>

        <div class="optionGrid" id="osOptions"></div>

        <button id="launchBtn">
            Launch Emulator
        </button>

    </div>
</div>

<div id="appetizeWrapper">
    <iframe
        id="appetize-iframe"
        allow="fullscreen"
        allowfullscreen>
    </iframe>
</div>

<script>
(async () => {

const devices = [
    "ipadair13",
    "ipadpro13",
    "ipadpro11",
    "ipadair11",
    "ipad10",
    "ipad9",
    "ipadmini"
];

const osVersions = [
    "26.0",
    "18.2",
    "17.2",
    "16.2",
    "15.5"
];

const deviceContainer = document.getElementById("deviceOptions");
const osContainer = document.getElementById("osOptions");

const overlay = document.getElementById("setupOverlay");
const launchBtn = document.getElementById("launchBtn");

let selectedDevice = null;
let selectedOS = null;

/* Build device buttons */
devices.forEach(device => {

    const btn = document.createElement("button");

    btn.className = "optionBtn";
    btn.textContent = device;

    btn.onclick = () => {

        selectedDevice = device;

        document.querySelectorAll("#deviceOptions .optionBtn")
            .forEach(b => b.classList.remove("selected"));

        btn.classList.add("selected");

        updateLaunch();
    };

    deviceContainer.appendChild(btn);
});

/* Build OS buttons */
osVersions.forEach(os => {

    const btn = document.createElement("button");

    btn.className = "optionBtn";
    btn.textContent = os;

    btn.onclick = () => {

        selectedOS = os;

        document.querySelectorAll("#osOptions .optionBtn")
            .forEach(b => b.classList.remove("selected"));

        btn.classList.add("selected");

        updateLaunch();
    };

    osContainer.appendChild(btn);
});

/* Enable launch button */
function updateLaunch() {

    if (selectedDevice && selectedOS) {
        launchBtn.classList.add("active");
    }
}

/* Generate URL */
function getURL(device, os) {

    return `https://appetize.io/embed/vhqck47rafavf76mxopgws2jie?device=${device}&osVersion=${os}&appearance=dark&audio=true&autoplay=true&scale=auto&centered=true&xdocMsg=true&launchApp=false&screenOnly=true&orientation=landscape`;
}

/* Wait for SDK */
async function waitForSDK() {

    await new Promise(resolve => {

        if (window.appetize) {
            resolve();
            return;
        }

        const interval = setInterval(() => {

            if (window.appetize) {

                clearInterval(interval);
                resolve();
            }

        }, 100);

    });
}

/* Launch */
launchBtn.onclick = async () => {

    overlay.classList.add("fadeOut");

    setTimeout(() => {
        overlay.remove();
    }, 300);

    const iframe = document.getElementById("appetize-iframe");

    iframe.src = getURL(selectedDevice, selectedOS);

    await waitForSDK();

    /* Auto fullscreen if supported */
    setTimeout(async () => {

        try {

            if (document.fullscreenEnabled) {

                await document.documentElement.requestFullscreen();

            } else if (document.webkitFullscreenEnabled) {

                document.documentElement.webkitRequestFullscreen();

            }

        } catch (e) {
            console.log("Fullscreen blocked:", e);
        }

    }, 1000);
};

/* Prevent bounce scrolling on iPad */
document.addEventListener(
    "touchmove",
    function(e) {
        e.preventDefault();
    },
    { passive: false }
);

})();
</script>

</body>
</html>
