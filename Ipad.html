<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>

<title>iPad Emulator</title>

<script src="https://js.appetize.io/embed.js"></script>

<!-- iPad Fullscreen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* ========================================= */
/* BASE */
/* ========================================= */

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
    background: black;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    touch-action: manipulation;
}

/* ========================================= */
/* EMULATOR */
/* ========================================= */

#appetizeWrapper {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
    background: black;
}

#appetize-iframe {

    width: 100vw;
    height: 100vh;

    border: none;
    background: black;
}

/* ========================================= */
/* SETUP OVERLAY */
/* ========================================= */

#setupOverlay {

    position: fixed;
    inset: 0;

    z-index: 10000;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.72);

    backdrop-filter: blur(24px);
}

#setupBox {

    width: 92%;
    max-width: 520px;

    max-height: 82vh;
    overflow-y: auto;

    padding: 24px;

    border-radius: 28px;

    background: rgba(28,28,28,0.97);

    box-shadow:
        0 0 30px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.04);

    animation: popIn 0.28s ease;
}

#setupBox h2 {

    margin-top: 0;
    margin-bottom: 20px;

    color: white;

    font-size: 26px;
    font-weight: 700;
}

#setupBox h3 {

    margin-top: 18px;
    margin-bottom: 12px;

    color: rgba(255,255,255,0.9);

    font-size: 16px;
    font-weight: 600;
}

/* ========================================= */
/* BUTTONS */
/* ========================================= */

.optionGrid {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(140px, 1fr));

    gap: 10px;
}

.optionBtn {

    border: none;
    border-radius: 18px;

    padding: 14px 10px;

    background: rgba(255,255,255,0.08);

    color: white;

    font-size: 14px;
    font-weight: 600;

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

    cursor: pointer;
}

.optionBtn:active {

    transform: scale(0.96);
}

.optionBtn.selected {

    background: #0a84ff;

    box-shadow:
        0 0 18px rgba(10,132,255,0.5);
}

/* ========================================= */
/* LAUNCH BUTTON */
/* ========================================= */

#launchBtn {

    width: 100%;

    margin-top: 22px;

    border: none;
    border-radius: 18px;

    padding: 16px;

    background: #0a84ff;
    color: white;

    font-size: 17px;
    font-weight: 700;

    opacity: 0.45;
    pointer-events: none;

    transition: 0.2s ease;
}

#launchBtn.active {

    opacity: 1;
    pointer-events: auto;
}

#launchBtn:active {

    transform: scale(0.98);
}

/* ========================================= */
/* REALISTIC IPAD HOME BAR */
/* ========================================= */

#homeSwipeZone {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 24px;

    z-index: 9999;

    display: flex;
    justify-content: center;
    align-items: flex-end;

    pointer-events: auto;
}

#homeBarVisual {

    width: 134px;
    height: 5px;

    border-radius: 999px;

    background: transparent;

    opacity: 0;

    margin-bottom: 8px;

    pointer-events: none;
}

/* ========================================= */
/* ANIMATIONS */
/* ========================================= */

.fadeOut {

    animation: fadeOut 0.3s forwards;
}

@keyframes popIn {

    from {

        opacity: 0;
        transform: scale(0.92);
    }

    to {

        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeOut {

    to {

        opacity: 0;
        transform: scale(0.92);
    }
}

/* ========================================= */
/* SAFE AREA */
/* ========================================= */

body {

    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
}

</style>
</head>

<body>

<!-- ========================================= -->
<!-- SETUP -->
<!-- ========================================= -->

<div id="setupOverlay">

    <div id="setupBox">

        <h2>Select iPad</h2>

        <div
            class="optionGrid"
            id="deviceOptions">
        </div>

        <h3>Select iPadOS Version</h3>

        <div
            class="optionGrid"
            id="osOptions">
        </div>

        <button id="launchBtn">
            Launch Emulator
        </button>

    </div>

</div>

<!-- ========================================= -->
<!-- EMULATOR -->
<!-- ========================================= -->

<div id="appetizeWrapper">

    <iframe
        id="appetize-iframe"
        allowfullscreen
        allow="fullscreen">
    </iframe>

</div>

<!-- ========================================= -->
<!-- HOME BAR -->
<!-- ========================================= -->

<div id="homeSwipeZone">
    <div id="homeBarVisual"></div>
</div>

<script>

(async () => {

/* ========================================= */
/* DEVICES */
/* ========================================= */

const devices = [

    "ipadmini",
    "ipadair11",
    "ipadair13",
    "ipadpro11",
    "ipadpro13",
    "ipad10",
    "ipad9"
];

/* ========================================= */
/* IOS VERSIONS */
/* ========================================= */

const osVersions = [

    "26.0",
    "18.2",
    "17.2",
    "16.2",
    "15.5"
];

/* ========================================= */
/* ELEMENTS */
/* ========================================= */

const deviceContainer =
    document.getElementById("deviceOptions");

const osContainer =
    document.getElementById("osOptions");

const overlay =
    document.getElementById("setupOverlay");

const launchBtn =
    document.getElementById("launchBtn");

const iframe =
    document.getElementById("appetize-iframe");

const swipeZone =
    document.getElementById("homeSwipeZone");

const homeBar =
    document.getElementById("homeBarVisual");

/* ========================================= */
/* VARIABLES */
/* ========================================= */

let selectedDevice = null;
let selectedOS = null;

let session = null;

let startY = 0;
let deltaY = 0;

/* ========================================= */
/* DEVICE BUTTONS */
/* ========================================= */

devices.forEach(device => {

    const btn =
        document.createElement("button");

    btn.className = "optionBtn";
    btn.textContent = device;

    btn.onclick = () => {

        selectedDevice = device;

        document
            .querySelectorAll(
                "#deviceOptions .optionBtn"
            )
            .forEach(b =>
                b.classList.remove("selected")
            );

        btn.classList.add("selected");

        updateLaunch();
    };

    deviceContainer.appendChild(btn);
});

/* ========================================= */
/* OS BUTTONS */
/* ========================================= */

osVersions.forEach(os => {

    const btn =
        document.createElement("button");

    btn.className = "optionBtn";
    btn.textContent = os;

    btn.onclick = () => {

        selectedOS = os;

        document
            .querySelectorAll(
                "#osOptions .optionBtn"
            )
            .forEach(b =>
                b.classList.remove("selected")
            );

        btn.classList.add("selected");

        updateLaunch();
    };

    osContainer.appendChild(btn);
});

/* ========================================= */
/* ENABLE LAUNCH */
/* ========================================= */

function updateLaunch() {

    if (
        selectedDevice &&
        selectedOS
    ) {

        launchBtn.classList.add("active");
    }
}

/* ========================================= */
/* EMULATOR URL */
/* ========================================= */

function getURL(device, os) {

    return `https://appetize.io/embed/vhqck47rafavf76mxopgws2jie?device=${device}&osVersion=${os}&appearance=dark&audio=true&autoplay=true&scale=auto&centered=true&xdocMsg=true&launchApp=false&screenOnly=true&orientation=landscape`;
}

/* ========================================= */
/* WAIT FOR SDK */
/* ========================================= */

async function waitForSDK() {

    await new Promise(resolve => {

        if (window.appetize) {

            resolve();
            return;
        }

        const interval =
            setInterval(() => {

                if (window.appetize) {

                    clearInterval(interval);
                    resolve();
                }

            }, 100);

    });
}

/* ========================================= */
/* LAUNCH */
/* ========================================= */

launchBtn.onclick = async () => {

    overlay.classList.add("fadeOut");

    setTimeout(() => {
        overlay.remove();
    }, 300);

    iframe.src =
        getURL(
            selectedDevice,
            selectedOS
        );

    await waitForSDK();

    const client =
        await window.appetize
            .getClient("#appetize-iframe");

    client.on("session", s => {
        session = s;
    });

    /* Auto Fullscreen */
    setTimeout(async () => {

        try {

            if (
                document.fullscreenEnabled
            ) {

                await document
                    .documentElement
                    .requestFullscreen();

            } else if (
                document.webkitFullscreenEnabled
            ) {

                document
                    .documentElement
                    .webkitRequestFullscreen();
            }

        } catch (e) {

            console.log(e);
        }

    }, 900);
};

/* ========================================= */
/* HOME GESTURE */
/* ========================================= */

/* Start */
swipeZone.addEventListener(
    "touchstart",
    (e) => {

        startY =
            e.touches[0].clientY;

        deltaY = 0;

        homeBar.style.transition =
            "none";

    },
    { passive: true }
);

/* Move */
swipeZone.addEventListener(
    "touchmove",
    (e) => {

        deltaY =
            startY -
            e.touches[0].clientY;

        if (deltaY > 0) {

            const move =
                Math.min(
                    deltaY / 2,
                    20
                );

            homeBar.style.transform =
                `translateY(-${move}px) scaleX(0.94)`;

            homeBar.style.opacity =
                "0.72";
        }

    },
    { passive: true }
);

/* End */
swipeZone.addEventListener(
    "touchend",
    () => {

        homeBar.style.transition =
            "transform 0.18s ease, opacity 0.18s ease";

        homeBar.style.transform =
            "translateY(0) scaleX(1)";

        homeBar.style.opacity =
            "1";

        /* Trigger Home */
        if (deltaY > 45) {

            try {

                session?.keypress("HOME");

            } catch (e) {

                console.log(e);
            }
        }

    }
);

/* ========================================= */
/* PREVENT IPAD BOUNCE */
/* ========================================= */

document.addEventListener(
    "touchmove",
    function(e) {

        e.preventDefault();

    },
    { passive: false }
);

})();
</script>

</body>
</html>
