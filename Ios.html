<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- FIX 1: Correct Appetize JS SDK script source -->
    <script src="https://appetize.io/js/appetize.js"></script>
    <style>
        /* FIX 2: Use 100dvh (Dynamic Viewport Height) for proper standalone Web App scaling */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            height: 100dvh; 
            background: black; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        
        #appetizeWrapper { 
            width: 100%; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }

        #appetize-iframe { 
            width: 100%;
            height: 100%; 
            aspect-ratio: 9 / 19.5; 
            border: none; 
            max-width: 100%; 
        }

        /* FIX 3: Added touch-action: none and safe-area adjustments so custom swipes work in Web App mode */
        #homeSwipeZone { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            z-index: 999; 
            touch-action: none; 
            padding-bottom: env(safe-area-inset-bottom);
        }

        #homeBarVisual { 
            position: absolute; 
            bottom: max(12px, env(safe-area-inset-bottom)); 
            left: 50%; 
            transform: translateX(-50%); 
            width: 120px; 
            height: 5px; 
            border-radius: 999px; 
            background: rgba(255, 255, 255, 0.4); 
            opacity: 0.8; 
            pointer-events: none; 
            transition: transform 0.12s ease, opacity 0.2s ease; 
        }

        /* SETUP OVERLAY */
        #setupOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #setupBox { background: rgba(30,30,30,0.95); padding: 20px; border-radius: 20px; width: 90%; max-width: 420px; max-height: 80vh; overflow-y: auto; }
        #setupBox h3 { color: white; margin-top: 15px; margin-bottom: 8px; font-size: 16px; }
        #setupBox h3:first-of-type { margin-top: 0; }
        .optionBtn { width: 100%; padding: 10px; margin: 6px 0; border-radius: 12px; border: none; background: #444; color: white; cursor: pointer; font-weight: 500; }
        .optionBtn.selected { background: #0a84ff; }
        
        #homeBtn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 22px; border-radius: 999px; border: none; background: rgba(255,255,255,0.12); color: white; font-size: 14px; font-weight: 600; backdrop-filter: blur(10px); display: none; z-index: 10000; }
    </style>
</head>
<body>
    <div id="setupOverlay">
        <div id="setupBox">
            <h3>Select Session Mode</h3>
            <div id="modeOptions">
                <button class="optionBtn selected" id="btnNormal">Normal Mode (Unlimited)</button>
                <button class="optionBtn" id="btnDemo">Demo Mode (Limited Time & needs proxy/unblocker)</button>
            </div>
            
            <h3>Select iPhone</h3>
            <div id="deviceOptions"></div>
            
            <h3>Select iOS Version</h3>
            <div id="osOptions"></div>
        </div>
    </div>
    
    <div id="appetizeWrapper">
        <iframe id="appetize-iframe"></iframe>
        <div id="homeSwipeZone">
            <div id="homeBarVisual"></div>
        </div>
    </div>
    <button id="homeBtn">Home</button>

    <script>
        (async () => {
            const devices = [
                "iphone17pro","iphone17promax",
                "iphone16pro","iphone16promax",
                "iphone15pro","iphone15promax",
                "iphone14pro","iphone14promax",
                "iphone13pro","iphone13promax",
                "iphone12","iphone11pro"
            ];
            const osVersions = ["18.2","17.2","16.2","15.5"];
            
            const normalApiKey = "vhqck47rafavf76mxopgws2jie";
            const demoApiKey = "demo_ea5a5c67z2eqszqkb64wu6t6ta";
            let selectedApiKey = normalApiKey; 
            
            const deviceContainer = document.getElementById("deviceOptions");
            const osContainer = document.getElementById("osOptions");
            const overlay = document.getElementById("setupOverlay");
            const iframe = document.getElementById("appetize-iframe");
            const swipeZone = document.getElementById("homeSwipeZone");
            const homeBar = document.getElementById("homeBarVisual");
            const homeBtn = document.getElementById("homeBtn");
            
            const btnNormal = document.getElementById("btnNormal");
            const btnDemo = document.getElementById("btnDemo");
            
            let selectedDevice = null;
            let selectedOS = null;
            let session = null;

            const isDesktop = !('ontouchstart' in window) || window.matchMedia("(pointer:fine)").matches;
            if (isDesktop) {
                swipeZone.style.display = "none";
                homeBtn.style.display = "block";
            }

            btnNormal.onclick = (e) => {
                e.stopPropagation();
                selectedApiKey = normalApiKey;
                btnNormal.classList.add("selected");
                btnDemo.classList.remove("selected");
            };
            btnDemo.onclick = (e) => {
                e.stopPropagation();
                selectedApiKey = demoApiKey;
                btnDemo.classList.add("selected");
                btnNormal.classList.remove("selected");
            };

            devices.forEach(device => {
                const btn = document.createElement("button");
                btn.className = "optionBtn";
                btn.textContent = device;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    selectedDevice = device;
                    document.querySelectorAll("#deviceOptions .optionBtn").forEach(b => b.classList.remove("selected"));
                    btn.classList.add("selected");
                    checkAndLaunch();
                };
                deviceContainer.appendChild(btn);
            });

            osVersions.forEach(os => {
                const btn = document.createElement("button");
                btn.className = "optionBtn";
                btn.textContent = os;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    selectedOS = os;
                    document.querySelectorAll("#osOptions .optionBtn").forEach(b => b.classList.remove("selected"));
                    btn.classList.add("selected");
                    checkAndLaunch();
                };
                osContainer.appendChild(btn);
            });

            function checkAndLaunch() {
                if (selectedDevice && selectedOS) {
                    overlay.remove();
                    load(selectedDevice, selectedOS);
                }
            }

            function getURL(device, os) {
                return `https://appetize.io/embed/${selectedApiKey}?device=${device}&osVersion=${os}&appearance=dark&audio=true&autoplay=true&scale=auto&centered=true&xdocMsg=true&launchApp=false&screenOnly=true&orientation=portrait`;
            }

            async function waitForSDK() {
                await new Promise(resolve => {
                    if (window.appetize) resolve();
                    else {
                        const i = setInterval(() => {
                            if (window.appetize) {
                                clearInterval(i);
                                resolve();
                            }
                        }, 100);
                    }
                });
            }

            async function tryFullscreen() {
                try {
                    const el = document.documentElement;
                    if (document.fullscreenEnabled && !document.fullscreenElement) {
                        await el.requestFullscreen();
                    } else if (el.webkitRequestFullscreen) {
                        el.webkitRequestFullscreen();
                    }
                } catch (e) {
                    console.log("Fullscreen request skipped or blocked:", e);
                }
            }

            async function load(device, os) {
                iframe.src = getURL(device, os);
                await waitForSDK();
                try {
                    const client = await window.appetize.getClient("#appetize-iframe");
                    client.on("session", s => session = s);
                } catch(err) {
                    console.error("SDK initialization error:", err);
                }
                
                tryFullscreen();
            }

            homeBtn.onclick = () => {
                session?.keypress("HOME");
            };

            /* SWIPE EVENT LISTENER FIX */
            let startY = 0;
            let deltaY = 0;

            swipeZone.addEventListener("touchstart", e => {
                startY = e.touches[0].clientY;
                deltaY = 0;
            }, { passive: false });

            swipeZone.addEventListener("touchmove", e => {
                e.preventDefault(); // Prevents iOS native viewport bounce/scroll
                deltaY = startY - e.touches[0].clientY;
                if (deltaY > 0) {
                    const move = Math.min(deltaY / 2.5, 20);
                    homeBar.style.transform = `translateX(-50%) translateY(-${move}px)`;
                    homeBar.style.opacity = "1";
                }
            }, { passive: false });

            swipeZone.addEventListener("touchend", () => {
                homeBar.style.transform = "translateX(-50%) translateY(0)";
                homeBar.style.opacity = "0.8";
                if (deltaY > 30) {
                    session?.keypress("HOME");
                }
            });
        })();
    </script>
</body>
</html>
