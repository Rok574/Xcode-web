<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Appetize Emulator">
    <title>Appetize Web App</title>

    <script>
        (function () {
            const n = window, i = document, o = i.getElementsByTagName("script")[0], t = i.createElement("script");
            t.src = "https://js.appetize.io/embed.js";
            t.async = 1;
            o.parentNode.insertBefore(t, o);
            const s = new Promise(function (e) { t.onload = function () { e(); }; });
            n.appetize = {
                getClient: function (...e) { return s.then(() => n.appetize.getClient(...e)); }
            };
        })();
    </script>

    <style>
        * { box-sizing: border-box; }
        
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            height: 100dvh; 
            background: #000; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
        }

        #appetizeWrapper { 
            width: 100%; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
        }

        #appetize-iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #000;
        }

        /* CUSTOM STEALTH SWIPE HOME BAR */
        #homeSwipeZone { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 40px; 
            z-index: 999; 
            touch-action: none; 
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #homeBarVisual { 
            width: 120px; 
            height: 3px; 
            border-radius: 999px; 
            background: rgba(255, 255, 255, 0.08); /* Almost completely invisible */
            margin-bottom: 2px; /* Fixed offset at absolute screen bottom */
            pointer-events: none; 
            transition: transform 0.12s ease, opacity 0.2s ease, background-color 0.2s ease; 
        }

        /* SETUP MODAL OVERLAY */
        #setupOverlay { 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999; 
        }

        #setupBox { 
            background: rgba(30, 30, 30, 0.95); 
            padding: 24px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 400px; 
            max-height: 80vh; 
            overflow-y: auto; 
            border: 1px solid rgba(255,255,255,0.1);
        }

        #setupBox h3 { 
            color: #fff; 
            margin-top: 18px; 
            margin-bottom: 8px; 
            font-size: 15px; 
            font-weight: 600;
            text-transform: uppercase;
        }

        #setupBox h3:first-of-type { margin-top: 0; }

        .optionBtn { 
            width: 100%; 
            padding: 12px; 
            margin: 4px 0; 
            border-radius: 10px; 
            border: 1px solid transparent; 
            background: rgba(255,255,255,0.08); 
            color: #eee; 
            cursor: pointer; 
            font-weight: 500; 
            font-size: 14px;
            text-align: left;
        }

        .optionBtn.selected { 
            background: #007aff; 
            color: #fff;
            font-weight: 600;
        }

        #homeBtn { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            padding: 10px 24px; 
            border-radius: 999px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(40, 40, 40, 0.85); 
            color: white; 
            font-size: 14px; 
            font-weight: 600; 
            backdrop-filter: blur(10px); 
            display: none; 
            z-index: 10000; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="setupOverlay">
        <div id="setupBox">
            <h3>Select Session Mode</h3>
            <div id="modeOptions">
                <button class="optionBtn selected" id="btnNormal">Normal Mode (Unlimited)</button>
                <button class="optionBtn" id="btnDemo">Demo Mode (Limited Time)</button>
            </div>
            
            <h3>Select iPhone</h3>
            <div id="deviceOptions"></div>
            
            <h3>Select iOS Version</h3>
            <div id="osOptions"></div>
        </div>
    </div>

    <div id="appetizeWrapper">
        <iframe id="appetize-iframe" allow="autoplay"></iframe>
        <div id="homeSwipeZone">
            <div id="homeBarVisual"></div>
        </div>
    </div>
    
    <button id="homeBtn">Home</button>

    <script>
        (async () => {
            // Officially supported Appetize iOS device identifiers
            const devices = [
                "iphone17pro", "iphone17promax",
                "iphone16pro", "iphone16promax",
                "iphone15pro", "iphone15promax",
                "iphone14pro", "iphone14promax",
                "iphone13pro", "iphone13promax",
                "iphone12", "iphone11pro"
            ];

            const osVersions = ["26.0", "18.2", "18.0", "17.2", "16.2", "15.5"];
            
            const normalApiKey = "vhqck47rafavf76mxopgws2jie";
            const demoApiKey = "demo_ea5a5c67z2eqszqkb64wu6t6ta";
            let selectedApiKey = normalApiKey; 
            
            const deviceContainer = document.getElementById("deviceOptions");
            const osContainer = document.getElementById("osOptions");
            const overlay = document.getElementById("setupOverlay");
            const iframe = document.getElementById("appetize-iframe");
            const swipeZone = document.getElementById("homeSwipeZone");
            const homeBar = document.getElementById("homeBarVisual");
            const homeBtn = document.getElementById("homeBtn");
            
            const btnNormal = document.getElementById("btnNormal");
            const btnDemo = document.getElementById("btnDemo");
            
            let selectedDevice = null;
            let selectedOS = null;
            let currentSession = null;

            const isDesktop = !('ontouchstart' in window) || window.matchMedia("(pointer:fine)").matches;
            if (isDesktop) {
                swipeZone.style.display = "none";
                homeBtn.style.display = "block";
            }

            btnNormal.onclick = (e) => {
                e.stopPropagation();
                selectedApiKey = normalApiKey;
                btnNormal.classList.add("selected");
                btnDemo.classList.remove("selected");
            };
            btnDemo.onclick = (e) => {
                e.stopPropagation();
                selectedApiKey = demoApiKey;
                btnDemo.classList.add("selected");
                btnNormal.classList.remove("selected");
            };

            function populateOptions(items, container, onSelect) {
                items.forEach(item => {
                    const btn = document.createElement("button");
                    btn.className = "optionBtn";
                    btn.textContent = item;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        container.querySelectorAll(".optionBtn").forEach(b => b.classList.remove("selected"));
                        btn.classList.add("selected");
                        onSelect(item);
                        checkAndLaunch();
                    };
                    container.appendChild(btn);
                });
            }

            populateOptions(devices, deviceContainer, val => selectedDevice = val);
            populateOptions(osVersions, osContainer, val => selectedOS = val);

            function checkAndLaunch() {
                if (selectedDevice && selectedOS) {
                    overlay.remove();
                    launchEmulator(selectedDevice, selectedOS);
                }
            }

            function getEmbedURL(device, os) {
                const params = new URLSearchParams({
                    device: device,
                    osVersion: os,
                    appearance: "dark",
                    autoplay: "true",
                    scale: "auto",
                    screenOnly: "true", 
                    centered: "both",
                    launchApp: "false" // shitty
                });
                return `https://appetize.io/embed/${selectedApiKey}?${params.toString()}`;
            }

            async function launchEmulator(device, os) {
                iframe.src = getEmbedURL(device, os);
                
                try {
                    const client = await window.appetize.getClient("#appetize-iframe");
                    client.on("session", session => {
                        currentSession = session;
                    });
                } catch (err) {
                    console.error("SDK Error:", err);
                }
            }

            async function triggerHome() {
                if (currentSession) {
                    try {
                        await currentSession.keypress("HOME");
                    } catch (e) {
                        console.error("Home keypress error:", e);
                    }
                }
            }

            homeBtn.onclick = triggerHome;

            // Touch Handling for Stealth Home Swipe Bar
            let startY = 0;
            let deltaY = 0;

            swipeZone.addEventListener("touchstart", e => {
                startY = e.touches[0].clientY;
                deltaY = 0;
                homeBar.style.backgroundColor = "rgba(255, 255, 255, 0.6)";
            }, { passive: false });

            swipeZone.addEventListener("touchmove", e => {
                e.preventDefault(); 
                deltaY = startY - e.touches[0].clientY;
                if (deltaY > 0) {
                    const move = Math.min(deltaY / 2, 20);
                    homeBar.style.transform = `translateY(-${move}px)`;
                }
            }, { passive: false });

            swipeZone.addEventListener("touchend", () => {
                homeBar.style.transform = "translateY(0)";
                homeBar.style.backgroundColor = "rgba(255, 255, 255, 0.08)";
                
                if (deltaY > 25) {
                    triggerHome();
                }
            });
        })();
    </script>
</body>
</html>
